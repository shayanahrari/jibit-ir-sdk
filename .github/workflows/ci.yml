name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,django,redis]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests
      - run: pytest --cov=jibit --cov-report=term-missing
      - run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip_audit .
      - run: python -m pip check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,django,redis]"
      - run: pytest

  django-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "~=5.2.0"
          - python-version: "3.13"
            django-version: "~=6.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "Django${{ matrix.django-version }}" pytest
      - run: pytest tests/test_django_integration.py tests/test_auth_tokens.py
