name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(Path("src/jibit/__about__.py").read_text(encoding="utf-8"))
          for statement in module.body:
              if isinstance(statement, ast.Assign):
                  for target in statement.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          print(ast.literal_eval(statement.value))
                          raise SystemExit(0)
          raise SystemExit("Package version was not found")
          PY
          )"
          if [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Package version ${package_version} does not match tag ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/jibit-ir-sdk/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
