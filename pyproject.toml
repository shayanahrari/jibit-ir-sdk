[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jibit-ir-sdk"
dynamic = ["version"]
description = "Unofficial Python SDK for Jibit APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Jibit IR SDK contributors" },
]
keywords = ["jibit", "payment", "fintech", "django", "sdk", "iran"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typing-extensions>=4.10; python_version < '3.11'",
]

[project.optional-dependencies]
django = ["Django>=4.2"]
redis = ["redis>=5,<7"]
dev = [
  "build>=1.2",
  "Django>=4.2",
  "hatchling>=1.27",
  "mkdocs-material>=9.5",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.2",
  "pytest-cov>=5",
  "redis>=5,<7",
  "respx>=0.21",
  "ruff>=0.6",
  "twine>=5.1",
]

[project.urls]
Documentation = "https://github.com/shayanahrari/jibit-ir-sdk#readme"
Issues = "https://github.com/shayanahrari/jibit-ir-sdk/issues"
Repository = "https://github.com/shayanahrari/jibit-ir-sdk"

[tool.hatch.version]
path = "src/jibit/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jibit"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["T201"]
"src/jibit/auth/specs.py" = ["S106"]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["jibit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jibit"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true
fail_under = 90
