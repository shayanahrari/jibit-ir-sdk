site_name: Jibit IR SDK
site_description: Unofficial Python SDK for Jibit APIs
repo_url: https://github.com/shayanahrari/jibit-ir-sdk
repo_name: shayanahrari/jibit-ir-sdk
docs_dir: docs
strict: true

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Authentication: authentication.md
  - Token storage: token-storage.md
  - Payment Gateway: payment-gateway.md
  - Identicator and KYC: identity-and-kyc.md
  - Error handling: error-handling.md
  - Logging and audit: logging.md
  - Retry and idempotency: retry-and-idempotency.md
  - API support: api-support.md
  - Source provenance: source-provenance.md
  - Decisions:
      - Package architecture: decisions/0001-package-architecture.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
